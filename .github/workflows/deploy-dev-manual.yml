on: workflow_dispatch

name: Deploy dev og experimental labs

jobs:
    deploy-dev-manual:
        name: deploy dev manual
        runs-on: ubuntu-latest
        permissions:
            contents: 'read'
            id-token: 'write'

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
              id: login
              with:
                  team: fager

            - name: 'Deploy dev-gcp'
              uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
              env:
                  CLUSTER: dev-gcp
                  RESOURCE: nais/dev-gcp.yaml
                  PRINT_PAYLOAD: true
                  VAR: commit=${{ github.sha }},image=${{ steps.login.outputs.registry }}/min-side-arbeidsgiver:${{ github.sha }}
                  REF: ${{ github.sha }}

    deploy-labs-manual:
        name: deploy labs manual
        runs-on: ubuntu-latest
        permissions:
            contents: 'read'
            id-token: 'write'

        steps:
            - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

            - uses: nais/login@40b72a35a18ddf2ad74b632461139ab838cc2a2f # v0
              id: login
              with:
                  team: fager

            - name: 'Deploy labs-gcp'
              uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # v3
              env:
                  CLUSTER: dev-gcp
                  RESOURCE: nais/demo-devlik.yaml
                  PRINT_PAYLOAD: true
                  VAR: commit=${{ github.sha }},image=${{ steps.login.outputs.registry }}/min-side-arbeidsgiver:${{ github.sha }}
                  REF: ${{ github.sha }}
