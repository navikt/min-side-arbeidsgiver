version: 2

registries:
  npm-github:
    type: npm-registry
    url: https://npm.pkg.github.com
    scope: "@navikt"
    replaces-base: false
    token: ${{ secrets.READER_TOKEN }}

updates:
  # pnpm-workspace (frontend/*). Kun oppdateringer innenfor rangene i package.json.
  - package-ecosystem: npm
    directory: "/"
    registries:
      - npm-github
    schedule:
      interval: weekly
      day: monday
      time: "06:00"
      timezone: Europe/Oslo
    cooldown:
      default-days: 3
    versioning-strategy: lockfile-only
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    groups:
      pnpm:
        patterns: ["*"]
        update-types: [minor, patch]
